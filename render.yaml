# Déploiement sur Render.
# Le disque du plan free est éphémère : renseignez les deux variables Upstash dans le dashboard
# Render (elles ne sont pas versions ici) pour que les comptes survivent aux redémarrages.
services:
  - type: web
    name: tank-arena
    runtime: node
    plan: free
    buildCommand: "echo ok"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TA_TUNNEL_KEY
        sync: false
