<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base blindée WW2 - Vue réaliste</title>
  <style>
    :root {
      --panel: rgba(10, 14, 18, 0.72);
      --border: rgba(255,255,255,0.12);
      --muted: #9fb0ba;
      --text: #edf3f7;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #091015;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 28%, #20333d 0%, #0a1219 38%, #070b0f 100%);
    }

    #sceneWrap {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#1a2d36, #0b1015 38%, #090d10);
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      padding: 8px 12px;
      backdrop-filter: blur(5px);
    }

    .pill span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .pill strong {
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .bottom {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
    }

    .info, .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      backdrop-filter: blur(5px);
    }

    .info {
      padding: 12px 14px;
      min-width: 260px;
    }

    .info .label, .stat .label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info .value {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 120px;
      padding: 10px 12px;
    }

    .stat .value {
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="sceneWrap">
    <div class="hud">
      <div class="topbar">
        <div class="pill"><span>Véhicule</span><strong id="tankName">Pz.Kpfw. III</strong></div>
        <div class="pill"><span>Base</span><strong>Camp de maintenance</strong></div>
      </div>

      <div class="bottom">
        <div class="info">
          <span class="label">Unité</span>
          <div class="value" id="unitInfo">Panzerkampfwagen III</div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="label">Vitesse</span>
            <div class="value" id="speedInfo">40 km/h</div>
          </div>
          <div class="stat">
            <span class="label">Calibre</span>
            <div class="value" id="caliberInfo">50 mm</div>
          </div>
          <div class="stat">
            <span class="label">Blindage</span>
            <div class="value" id="armorInfo">35 mm</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/three.min.js"></script>
  <script>
    const sceneWrap = document.getElementById('sceneWrap');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    sceneWrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101a20);
    scene.fog = new THREE.Fog(0x101a20, 35, 160);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(22, 13, 25);
    camera.lookAt(0, 2.2, 0);

    const hemi = new THREE.HemisphereLight(0xdfefff, 0x1a201d, 1.5);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xf5d09a, 1.8);
    sun.position.set(18, 28, 16);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -80;
    sun.shadow.camera.right = 80;
    sun.shadow.camera.top = 80;
    sun.shadow.camera.bottom = -80;
    scene.add(sun);

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x766a5c, roughness: 1, metalness: 0.04 });
    const pathMat = new THREE.MeshStandardMaterial({ color: 0x4d4d52, roughness: 0.92, metalness: 0.14 });
    const concreteMat = new THREE.MeshStandardMaterial({ color: 0xabb0b3, roughness: 0.9, metalness: 0.15 });
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x7f8079, roughness: 0.95, metalness: 0.1 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x4f4b46, roughness: 0.96, metalness: 0.08 });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x2e3438, roughness: 0.78, metalness: 0.85 });
    const sandMat = new THREE.MeshStandardMaterial({ color: 0x8f7a5f, roughness: 1, metalness: 0.04 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x4d382b, roughness: 1, metalness: 0.04 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x2b3137, roughness: 0.8, metalness: 0.7 });

    function addBox(w, h, d, x, y, z, material, cast = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function addCylinder(r1, r2, h, x, y, z, material, cast = true) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, 24), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function addPyramid(w, h, d, x, y, z, material) {
      const mesh = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.7, h, 4), material);
      mesh.position.set(x, y + h / 2, z);
      mesh.rotation.y = Math.PI / 4;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function addBuilding(options) {
      const { x, z, w, d, h, roof = 'flat', roofHeight = 2.5, wallColor = wallMat, roofColor = roofMat } = options;
      const group = new THREE.Group();

      const main = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallColor);
      main.position.y = h / 2;
      main.castShadow = true;
      main.receiveShadow = true;
      group.add(main);

      if (roof === 'flat') {
        const roofMesh = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.55, d + 0.6), roofColor);
        roofMesh.position.y = h + 0.2;
        roofMesh.castShadow = true;
        roofMesh.receiveShadow = true;
        group.add(roofMesh);
      } else if (roof === 'pyramid') {
        const roofMesh = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.66, roofHeight, 4), roofColor);
        roofMesh.position.y = h + 1.3;
        roofMesh.rotation.y = Math.PI / 4;
        roofMesh.castShadow = true;
        roofMesh.receiveShadow = true;
        group.add(roofMesh);
      }

      // doors and windows
      const door = new THREE.Mesh(new THREE.BoxGeometry(w * 0.18, h * 0.54, 0.2), trimMat);
      door.position.set(0, h * 0.38, d / 2 + 0.12);
      door.castShadow = true;
      group.add(door);

      const win = new THREE.Mesh(new THREE.BoxGeometry(w * 0.56, h * 0.2, 0.08), trimMat);
      win.position.set(0, h * 0.5, d / 2 + 0.12);
      group.add(win);

      group.position.set(x, 0, z);
      scene.add(group);
      return group;
    }

    function addBarrier(x, z, rot = 0, length = 4) {
      const g = new THREE.Group();
      for (let i = -1; i <= 1; i++) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.45), sandMat);
        bar.position.set(i * 1.1, 0.4, 0);
        bar.castShadow = true;
        bar.receiveShadow = true;
        g.add(bar);
      }
      g.position.set(x, 0, z);
      g.rotation.y = rot;
      scene.add(g);
      return g;
    }

    function addRoadMark(x, z, rot = 0) {
      const mark = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.02, 0.9), new THREE.MeshStandardMaterial({ color: 0xe5e3d4, roughness: 0.8, metalness: 0.1 }));
      mark.position.set(x, 0.48, z);
      mark.rotation.y = rot;
      scene.add(mark);
    }

    // large terrain
    const field = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), groundMat);
    field.rotation.x = -Math.PI / 2;
    field.receiveShadow = true;
    scene.add(field);

    const yard = new THREE.Mesh(new THREE.BoxGeometry(108, 0.3, 98), new THREE.MeshStandardMaterial({ color: 0x7d7468, roughness: 1, metalness: 0.05 }));
    yard.position.set(0, 0.12, 0);
    yard.receiveShadow = true;
    scene.add(yard);

    const tarmac = new THREE.Mesh(new THREE.BoxGeometry(80, 0.18, 44), pathMat);
    tarmac.position.set(0, 0.25, 0);
    tarmac.receiveShadow = true;
    scene.add(tarmac);

    // roads
    const roadMain = new THREE.Mesh(new THREE.BoxGeometry(12, 0.08, 72), pathMat);
    roadMain.position.set(0, 0.32, -10);
    roadMain.receiveShadow = true;
    scene.add(roadMain);

    const roadEast = new THREE.Mesh(new THREE.BoxGeometry(94, 0.08, 12), pathMat);
    roadEast.position.set(0, 0.32, 18);
    roadEast.receiveShadow = true;
    scene.add(roadEast);

    for (let i = -30; i <= 30; i += 6) {
      addRoadMark(i, -10, 0);
      addRoadMark(i, 18, 0);
    }

    // perimeter and base blocks
    addBox(2.2, 2.6, 90, -62, 1.3, 0, trimMat);
    addBox(2.2, 2.6, 90, 62, 1.3, 0, trimMat);
    addBox(120, 2.6, 2.2, 0, 1.3, -62, trimMat);
    addBox(120, 2.6, 2.2, 0, 1.3, 62, trimMat);

    addBox(0.8, 1.8, 0.8, -58, 0.9, -58, trimMat);
    addBox(0.8, 1.8, 0.8, 58, 0.9, -58, trimMat);
    addBox(0.8, 1.8, 0.8, -58, 0.9, 58, trimMat);
    addBox(0.8, 1.8, 0.8, 58, 0.9, 58, trimMat);

    // main depot building groups
    addBuilding({ x: -40, z: -28, w: 28, d: 12, h: 7, roof: 'pyramid', roofHeight: 5.5 });
    addBuilding({ x: 40, z: -28, w: 28, d: 12, h: 7, roof: 'pyramid', roofHeight: 5.5 });
    addBuilding({ x: -40, z: 30, w: 24, d: 14, h: 7.5, roof: 'pyramid', roofHeight: 6.4 });
    addBuilding({ x: 40, z: 30, w: 24, d: 14, h: 7.5, roof: 'pyramid', roofHeight: 6.4 });

    // workshop and support buildings
    addBuilding({ x: -20, z: -52, w: 18, d: 12, h: 6, roof: 'flat' });
    addBuilding({ x: 20, z: -52, w: 18, d: 12, h: 6, roof: 'flat' });
    addBuilding({ x: -55, z: 8, w: 12, d: 10, h: 5.4, roof: 'flat' });
    addBuilding({ x: 55, z: 8, w: 12, d: 10, h: 5.4, roof: 'flat' });

    // fuel storage area
    addCylinder(2.6, 2.6, 6, -14, 3, 28, darkMat);
    addCylinder(2.6, 2.6, 6, -20, 3, 28, darkMat);
    addCylinder(2.6, 2.6, 6, -26, 3, 28, darkMat);
    addCylinder(2.6, 2.6, 6, 14, 3, 28, darkMat);
    addCylinder(2.6, 2.6, 6, 20, 3, 28, darkMat);
    addCylinder(2.6, 2.6, 6, 26, 3, 28, darkMat);

    // pipes
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 17, 12), trimMat);
    pipe.rotation.z = Math.PI / 2;
    pipe.position.set(-18, 4.5, 28);
    scene.add(pipe);
    const pipe2 = pipe.clone();
    pipe2.position.x = 18;
    scene.add(pipe2);

    // sandbags and obstacles
    for (let x = -28; x <= 28; x += 8) {
      addBarrier(x, -12, 0);
      addBarrier(x, 11, 0);
    }
    for (let z = -18; z <= 18; z += 8) {
      addBarrier(-34, z, Math.PI / 2);
      addBarrier(34, z, Math.PI / 2);
    }

    // crates and small equipment
    for (let i = 0; i < 18; i++) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), woodMat);
      c.position.set((i % 6) * 2.8 - 7, 0.7, Math.floor(i / 6) * 2.8 + 1);
      c.castShadow = true;
      c.receiveShadow = true;
      scene.add(c);
    }

    // military truck
    const truck = new THREE.Group();
    const truckBody = new THREE.Mesh(new THREE.BoxGeometry(5.5, 2.2, 2.7), darkMat);
    truckBody.position.y = 1.8;
    truck.add(truckBody);
    const truckCab = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.1, 2.4), wallMat);
    truckCab.position.set(-2.1, 2.9, 0);
    truck.add(truckCab);
    for (let i = -2.2; i <= 2.2; i += 2.2) {
      for (let side = -1; side <= 1; side += 2) {
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.65, 18), trimMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(i, 0.6, side * 1.5);
        truck.add(w);
      }
    }
    truck.position.set(-18, 0, 46);
    truck.rotation.y = -0.7;
    scene.add(truck);

    // selected tank on central pad
    const tankGroup = new THREE.Group();
    scene.add(tankGroup);

    const hull = new THREE.Mesh(new THREE.BoxGeometry(7.8, 2.2, 3.8), new THREE.MeshStandardMaterial({ color: 0x8a7b68, roughness: 0.85, metalness: 0.32 }));
    hull.position.y = 1.3;
    hull.castShadow = true;
    hull.receiveShadow = true;
    tankGroup.add(hull);

    const turret = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.05, 2.7), new THREE.MeshStandardMaterial({ color: 0x7a776d, roughness: 0.8, metalness: 0.42 }));
    turret.position.set(0.9, 2.25, 0);
    turret.castShadow = true;
    turret.receiveShadow = true;
    tankGroup.add(turret);

    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 6.2, 18), new THREE.MeshStandardMaterial({ color: 0x2d373e, roughness: 0.62, metalness: 0.9 }));
    barrel.rotation.z = Math.PI / 2;
    barrel.position.set(4.6, 2.25, 0);
    turret.add(barrel);

    const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.9, 12), darkMat);
    muzzle.rotation.z = Math.PI / 2;
    muzzle.position.set(8.3, 2.25, 0);
    turret.add(muzzle);

    const skirt1 = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.6, 0.18), new THREE.MeshStandardMaterial({ color: 0x717264, roughness: 0.9, metalness: 0.25 }));
    skirt1.position.set(0, 1.1, 1.95);
    tankGroup.add(skirt1);
    const skirt2 = skirt1.clone();
    skirt2.position.z = -1.95;
    tankGroup.add(skirt2);

    for (let i = -2; i <= 2; i++) {
      for (let side = -1; side <= 1; side += 2) {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.5, 18), new THREE.MeshStandardMaterial({ color: 0x1b1f22, roughness: 0.8, metalness: 0.8 }));
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(i * 1.7, 0.6, side * 1.9);
        wheel.castShadow = true;
        wheel.receiveShadow = true;
        tankGroup.add(wheel);
      }
    }

    tankGroup.position.set(0, 0.18, 0);
    tankGroup.rotation.y = -0.9;

    const hudTankName = document.getElementById('tankName');
    const unitInfo = document.getElementById('unitInfo');
    const speedInfo = document.getElementById('speedInfo');
    const caliberInfo = document.getElementById('caliberInfo');
    const armorInfo = document.getElementById('armorInfo');

    const selectedTank = { name: 'Pz.Kpfw. III', unit: 'Panzerkampfwagen III', speed: '40 km/h', caliber: '50 mm', armor: '35 mm' };
    hudTankName.textContent = selectedTank.name;
    unitInfo.textContent = selectedTank.unit;
    speedInfo.textContent = selectedTank.speed;
    caliberInfo.textContent = selectedTank.caliber;
    armorInfo.textContent = selectedTank.armor;

    const clock = new THREE.Clock();

    function animate() {
      const t = clock.getElapsedTime();
      tankGroup.rotation.y = -0.9 + Math.sin(t * 0.8) * 0.18;
      tankGroup.position.y = 0.18 + Math.sin(t * 1.7) * 0.04;
      camera.position.set(22, 13, 25);
      camera.lookAt(0, 2.2, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
